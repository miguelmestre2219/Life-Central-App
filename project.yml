name: LifeCentral
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LifeCentral:
    type: application
    platform: iOS
    sources: [LifeCentral]
    # Bundle id and signing team live here, so regenerating the project keeps them.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    scheme: {}
    info:
      path: LifeCentral/Info.plist
      properties:
        CFBundleDisplayName: Life Central
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scan documents and take receipt photos.
        NSPhotoLibraryUsageDescription: Add photos of documents and receipts.
        NSFaceIDUsageDescription: Keep your documents and the app locked with Face ID.
        NSHealthShareUsageDescription: Show your steps, sleep, heart rate, weight and other health data in Life Central.
        NSHealthUpdateUsageDescription: Save your workouts, weight and water to Apple Health.
        NSLocationWhenInUseUsageDescription: Show where you are on your trip maps.
    entitlements:
      path: LifeCentral/LifeCentral.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
