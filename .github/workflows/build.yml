name: Build

# Compiles the app for the iPhone simulator on every push, so a mistake shows
# up here before it reaches Xcode on the Mac. Nothing is signed or uploaded.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for the simulator
        run: |
          xcodebuild build -quiet \
            -project LifeCentral.xcodeproj \
            -scheme LifeCentral \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
